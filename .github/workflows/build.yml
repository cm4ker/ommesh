# Every push to master is checked and built for every home the client has:
# Windows installers for x64, 32-bit x86 and ARM64, a universal macOS app, Linux
# AppImages and .deb packages for x64 and ARM64, a debug Android APK and the web
# bundle. Each push gets its own pre-release, and only the newest two are kept;
# `dev/latest.json` points to the newest one. A matching `vX.Y.Z` tag makes a stable release. PRs get
# workflow artifacts. The web bundle of every published push also goes to
# https://ommesh.cm4ker.ru. iOS is left out: it is built on a Mac and uploaded to
# TestFlight by hand (apps/mobile/README.md).
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Do not interrupt a release between uploading its packages and promoting its feed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Typecheck, test, web bundle
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: node scripts/release.mjs prepare
      - run: pnpm typecheck
      - run: pnpm test
      - name: Radio core checks
        run: cargo test --manifest-path crates/meshcore-core/Cargo.toml
      - run: pnpm --filter @meshnet/web build
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-web
          path: apps/web/dist
          if-no-files-found: error

  # The web version people open without installing anything, on the reg.ru hosting.
  # Its FTP user sees only the site's folder. The hashed assets go up first, so a
  # visitor never gets a new index.html that names files not there yet; the second
  # pass uploads the rest and removes what the new build no longer has.
  # The FTP server sends its certificate without the intermediate one, which lftp
  # does not fetch by itself, so it is fetched from the address the certificate
  # names and the whole chain is still checked against the system's roots.
  web-site:
    name: Web site
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: web-site
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meshnet-web
          path: web
      - run: sudo apt-get install -y -qq lftp
      - name: Upload to ommesh.cm4ker.ru
        env:
          FTP_USER: ${{ secrets.WEB_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.WEB_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          host=server223.hosting.reg.ru
          echo | openssl s_client -starttls ftp -connect "$host:21" -servername "$host" 2>/dev/null | openssl x509 > leaf.pem
          issuer=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI://p')
          curl -fsS "$issuer" -o issuer.crt
          openssl x509 -in issuer.crt -inform DER -out issuer.pem 2>/dev/null || openssl x509 -in issuer.crt -out issuer.pem
          cat /etc/ssl/certs/ca-certificates.crt issuer.pem > ca.pem
          lftp -c "
            set ssl:ca-file ca.pem
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set net:max-retries 3
            set net:timeout 30
            open --env-password -u $FTP_USER ftp://$host
            mirror -R --no-perms --parallel=4 --verbose web/assets assets
            mirror -R --no-perms --parallel=4 --verbose --delete web .
          "

  desktop-windows:
    name: Windows ${{ matrix.arch }}
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            vc-arch: amd64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            vc-arch: amd64_arm64
          # 32-bit Windows, for older machines; WebView2 and WinRT Bluetooth both run there.
          - arch: x86
            target: i686-pc-windows-msvc
            vc-arch: amd64_x86
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vc-arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs prepare
      # PR/local packages do not need the private key. Publishing fails closed if it is missing.
      - name: Build NSIS and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: pnpm --filter @meshnet/desktop exec tauri build --config src-tauri/tauri.release.json --target ${{ matrix.target }} --bundles nsis
      # The same app again with WebView2's offline installer inside, for a machine with
      # neither WebView2 nor the internet (Windows 10 LTSC, a fresh image). It is bundled
      # from the binary just built, and stays out of the update feed.
      - name: Offline installer with WebView2
        shell: bash
        run: |
          nsis=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis
          mkdir dist-win
          mv "$nsis"/*.exe* dist-win/
          pnpm --filter @meshnet/desktop exec tauri bundle --config src-tauri/tauri.release.json --config src-tauri/tauri.offline.json --target ${{ matrix.target }} --bundles nsis
          for f in "$nsis"/*-setup.exe; do mv "$f" "dist-win/$(basename "${f%-setup.exe}")-offline-setup.exe"; done
          ls -l dist-win
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-windows-${{ matrix.arch }}
          path: dist-win/*
          if-no-files-found: error

  # One app for Apple silicon and Intel Macs: a disk image to install from and the
  # archive the updater downloads. Without a Developer ID the app is signed ad hoc
  # (tauri.conf.json), and macOS asks once, in System Settings, to let it open. With
  # the APPLE_* secrets of a publishing push it is signed with the Developer ID and,
  # given the App Store Connect key, notarized, and opens like any other app.
  desktop-macos:
    name: macOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: universal-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs prepare
      - name: Build the app, its disk image and updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          DEVELOPER_ID_CERTIFICATE: ${{ needs.check.outputs.publish == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # Tauri reads these names whenever they are set, empty or not, so they are set only with a value.
          if [ -n "$DEVELOPER_ID_CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$DEVELOPER_ID_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$DEVELOPER_ID_CERTIFICATE_PASSWORD" APPLE_SIGNING_IDENTITY="$DEVELOPER_ID"
            if [ -n "$NOTARY_KEY" ]; then
              export APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_ISSUER="$NOTARY_ISSUER" APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
              printf '%s\n' "$NOTARY_KEY" > "$APPLE_API_KEY_PATH"
            fi
          elif [ "${{ needs.check.outputs.publish }}" = "true" ]; then
            echo "::warning::No Developer ID: the Mac app is signed ad hoc, and macOS asks to allow it on first opening."
          fi
          pnpm --filter @meshnet/desktop exec tauri build --config src-tauri/tauri.release.json --target universal-apple-darwin --bundles app,dmg
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          # Tauri notarizes the app but not the disk image around it, and macOS judges a
          # downloaded image before it opens it. The staple fails, and the build with it,
          # unless Apple accepted the image.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            for dmg in "$bundle"/dmg/*.dmg; do
              xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
              xcrun stapler staple "$dmg"
            done
          fi
          mkdir dist-mac
          mv "$bundle"/dmg/*.dmg dist-mac/
          # The updater's archive is named after the app alone; the feed wants the version
          # and the architecture in the name, as every other package has them.
          if [ -f "$bundle/macos/Ommesh.app.tar.gz" ]; then
            for f in "$bundle"/macos/Ommesh.app.tar.gz*; do mv "$f" "dist-mac/Ommesh_${MESHNET_VERSION}_universal${f#"$bundle"/macos/Ommesh}"; done
          fi
          ls -l dist-mac
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-macos
          path: dist-mac/*
          if-no-files-found: error

  # Linux on x64 and ARM64 (a Raspberry Pi 4 or 5 with a 64-bit system): an AppImage
  # that runs on most distributions and updates itself, and a .deb for Debian and
  # Ubuntu, which the updater installs with the system asking for the password.
  # Built on the oldest Ubuntu GitHub offers, as an AppImage runs only where glibc
  # is at least as new as the one it was built against (2.35 here).
  desktop-linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The webview and the tray icon, the menu's shortcuts, D-Bus for Bluetooth and the
      # keyring, udev for the serial ports; patchelf, file and FUSE for the AppImage, which
      # also carries xdg-open to open links in the system's browser.
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev libudev-dev patchelf file libfuse2 xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: linux-${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs prepare
      - name: Build AppImage, .deb and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          pnpm --filter @meshnet/desktop exec tauri build --config src-tauri/tauri.release.json --bundles appimage,deb
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir dist-linux
          mv "$bundle"/appimage/*.AppImage* "$bundle"/deb/*.deb* dist-linux/
          dpkg-deb --field dist-linux/*.deb Package Version Architecture Depends
          ls -l dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-linux-${{ matrix.arch }}
          path: dist-linux/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Rust for the radio core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/meshcore-core
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs prepare
      # A fixed debug key lets each APK install over the previous one. PRs from forks
      # have no secrets and fall back to a throwaway key. The run number grows with
      # every build, so Android takes a newer APK as an update of the older one.
      - name: Build APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            export ANDROID_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/debug.keystore"
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$ANDROID_DEBUG_KEYSTORE_PATH"
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_BASE64; this APK will not install over earlier ones."
          fi
          pnpm --filter @meshnet/mobile android:apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep SHA-256
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-android
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish
    needs: [check, desktop-windows, desktop-macos, desktop-linux, android]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: meshnet-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Lay out the files
        run: |
          mkdir out
          cp artifacts/meshnet-windows-x64/*.exe* out/
          cp artifacts/meshnet-windows-arm64/*.exe* out/
          cp artifacts/meshnet-windows-x86/*.exe* out/
          cp artifacts/meshnet-macos/* artifacts/meshnet-linux-x64/* artifacts/meshnet-linux-arm64/* out/
          # The README links these names, which stay the same from build to build.
          # They do not end the way the feed's packages do, so the update feed never picks them.
          for arch in x64 arm64 x86; do cp out/Ommesh_*_${arch}-setup.exe out/Ommesh-setup-${arch}.exe; done
          cp out/Ommesh_*_universal.dmg out/Ommesh-macos.dmg
          cp out/Ommesh_*_amd64.AppImage out/Ommesh-linux-x64.AppImage
          cp out/Ommesh_*_amd64.deb out/Ommesh-linux-x64.deb
          cp out/Ommesh_*_aarch64.AppImage out/Ommesh-linux-arm64.AppImage
          cp out/Ommesh_*_arm64.deb out/Ommesh-linux-arm64.deb
          cp artifacts/meshnet-android/app-debug.apk out/Ommesh_android-debug.apk
          (cd artifacts/meshnet-web && zip -qr ../../out/Ommesh_web.zip .)
          ls -l out
      - name: Create the complete update feed
        run: node scripts/release.mjs manifest out
      - name: Publish signed release, then promote the channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish out
