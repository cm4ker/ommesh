[package]
name = "meshcore-core"
version = "0.1.0"
edition = "2021"
description = "The radio's side of Meshnet for every shell: one radio shared by several clients, and notices while the page sleeps"
publish = false

[lib]
name = "meshcore_core"
# A library for the desktop shell and the tests, a shared one for Android, a static one for iOS.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32"
# The fetch behind a link preview, which the phones' native code reaches through
# these bindings; not radio logic, and so behind a feature of its own.
link-fetch = { path = "../link-fetch", optional = true }

[features]
# The Kotlin and Swift bindings' generator (`cargo run --features bindgen --bin uniffi-bindgen`).
bindgen = ["uniffi/cli"]
# `link_fetch` for the phone that builds with it (iOS, see scripts/core-ios.sh).
link-fetch = ["dep:link-fetch"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[profile.release]
# The phone carries it: small over fast. Not stripped: the bindings are read from its symbols, and Android strips it when it packs it.
opt-level = "s"
lto = true
codegen-units = 1
