[package]
name = "meshnet-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "A MeshCore companion in a window of its own"

[lib]
name = "meshnet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The icon by the clock, drawn from the bundled PNG with a dot for what is unread; see `tray.rs`.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# The two links a desktop has to a radio. WebView2 and WebKit have neither
# Web Bluetooth nor Web Serial, so the shell carries them: btleplug for BLE,
# serialport for the cable. The client calls them through the plugins' JS.
tauri-plugin-blec = "0.14"
tauri-plugin-serialplugin = "3"
# Links in messages open in the system browser, not in this window.
tauri-plugin-opener = "2"
# What the BLE and serial plugins say, on stderr when `RUST_LOG` is set. A
# release build is a windowed application with no stderr to speak of, so this
# costs nothing there; a debug build run from a terminal shows the link.
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
# Node passwords the client is asked to remember go to the system's
# credential store, not to a file of the webview's.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# A message or a new node, announced by the system while the window is
# elsewhere: WebView2 has no notification of its own. The plugin draws it on
# macOS and Linux; Windows is drawn directly, see `announce.rs`.
tauri-plugin-notification = "2"
serde_json = "1"
# The sender's circle arrives from the page as base64 PNG (`announce.rs`).
base64 = "0.22"
# A radio on Wi-Fi is a plain `std::net` socket (`tcp.rs`); this only sets its
# keepalive, which std does not expose. Already in the tree through tokio.
socket2 = "0.6"
tauri-plugin-updater = "2"
# Not called here: this only turns on SOCKS in the updater's own reqwest.
# Without it an `HTTPS_PROXY=socks5://…` inherited from the environment fails
# every update check at once with "unsupported scheme socks5".
reqwest = { version = "0.13", default-features = false, features = ["socks"] }
# Starting with the computer, switched from the client's Connection page: a
# Run key on Windows, a launch agent on macOS, an autostart entry on Linux.
tauri-plugin-autostart = "2"
# One app at a time: a second start brings the first one's window back.
tauri-plugin-single-instance = "2"
# The window opens where it was left and at the size it was, maximised or not.
tauri-plugin-window-state = "2"

# On Windows the BLE link is the platform's own GATT API, not btleplug: the
# firmware's UART characteristics demand an encrypted link, and btleplug's
# characteristic discovery on such a service times out and wedges, whereas
# WinRT raises the link to the bond's encryption on the first protected
# operation and carries on. See `winble.rs`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    # Toasts with a tag, to replace and withdraw; see `announce.rs`.
    "UI_Notifications",
    # The BLE worker is a single-threaded apartment with a message pump; see `winble.rs`.
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
# `IAsyncOperation` and `AsyncStatus` live here since windows 0.60.
windows-future = "0.2"
# The notices window shown without taking the focus, the app's signal played
# from memory, and whether Windows is keeping quiet; see `notices.rs`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# A shipped binary is built once and run for months, so the slow settings are
# the right ones here.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
