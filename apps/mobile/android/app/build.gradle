import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// CI names each build (0.3.0-dev.108.1, from scripts/release.mjs); the web About page shows the same.
def appVersion = System.getenv('MESHNET_VERSION') ?: new groovy.json.JsonSlurper().parse(rootProject.file('../../../package.json')).version
def buildNumber = System.getenv('ANDROID_VERSION_CODE') ?: '1'
if (!(buildNumber ==~ /[1-9][0-9]*/) || new BigInteger(buildNumber) > 2100000000) {
    throw new GradleException('ANDROID_VERSION_CODE must be an integer from 1 to 2100000000.')
}

// Upload credentials stay outside source control. Environment variables take precedence.
def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def signingValue = { env, property -> System.getenv(env) ?: signingProperties.getProperty(property) }
def uploadStore = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def uploadStorePassword = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def uploadAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def uploadKeyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasUploadKey = uploadStore && uploadStorePassword && uploadAlias && uploadKeyPassword
// CI signs every debug APK with one kept key, so a new build installs over the last one.
// Without it each runner makes its own debug key and Android refuses the update.
def debugStore = System.getenv('ANDROID_DEBUG_KEYSTORE_PATH')
def rustOut = layout.buildDirectory.dir('rust').get().asFile

android {
    namespace = "dev.cm4ker.meshnet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.cm4ker.meshnet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(buildNumber)
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The ABIs the radio core is built for (buildRustCore); JNA brings more, which would run without it.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (debugStore) {
            debug {
                storeFile file(debugStore)
            }
        }
        if (hasUploadKey) {
            release {
                storeFile rootProject.file(uploadStore)
                storePassword uploadStorePassword
                keyAlias uploadAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    sourceSets {
        main {
            // The radio core (crates/meshcore-core), built by buildRustCore, and its Kotlin bindings.
            jniLibs.srcDir new File(rustOut, 'jniLibs')
            java.srcDir new File(rustOut, 'kotlin')
        }
    }
    buildTypes {
        release {
            if (hasUploadKey) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

// The radio core: Rust, shared with iOS and the desktop (crates/meshcore-core). Built for the phones'
// ABIs with cargo-ndk, which finds the NDK under ANDROID_HOME; its Kotlin bindings are read off the
// built library. Needs cargo, the Android targets (rustup target add aarch64-linux-android
// armv7-linux-androideabi x86_64-linux-android) and cargo-ndk (cargo install cargo-ndk).
def rustCore = rootProject.file('../../../crates/meshcore-core')

tasks.register('buildRustCore', Exec) {
    description = 'Builds the radio core for the phone.'
    workingDir rustCore
    inputs.dir(new File(rustCore, 'src'))
    inputs.files(new File(rustCore, 'Cargo.toml'), new File(rustCore, 'Cargo.lock'))
    outputs.dir(new File(rustOut, 'jniLibs'))
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'armeabi-v7a', '-t', 'x86_64', '--platform', '24',
        '-o', new File(rustOut, 'jniLibs').path, 'build', '--release', '--locked'
}

tasks.register('bindRustCore', Exec) {
    description = "Writes the radio core's Kotlin bindings."
    dependsOn 'buildRustCore'
    workingDir rustCore
    inputs.dir(new File(rustOut, 'jniLibs'))
    inputs.file(new File(rustCore, 'uniffi.toml'))
    outputs.dir(new File(rustOut, 'kotlin'))
    commandLine 'cargo', 'run', '-q', '--locked', '--features', 'bindgen', '--bin', 'uniffi-bindgen', '--',
        'generate', '--library', new File(rustOut, 'jniLibs/arm64-v8a/libmeshcore_core.so').path,
        '--language', 'kotlin', '--no-format', '--out-dir', new File(rustOut, 'kotlin').path
}

tasks.named('preBuild') {
    dependsOn 'bindRustCore'
}

tasks.register('validatePlayRelease') {
    doLast {
        if (!System.getenv('ANDROID_VERSION_CODE')) {
            throw new GradleException('Set ANDROID_VERSION_CODE to an unused, increasing Play build number.')
        }
        if (System.getenv('CAP_SERVER_URL')) {
            throw new GradleException('Unset CAP_SERVER_URL before building a release. The app must carry its web assets.')
        }
        if (!hasUploadKey || !rootProject.file(uploadStore).isFile()) {
            throw new GradleException('Configure the upload key in keystore.properties or ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.')
        }
    }
}

tasks.register('verifyReleaseAssets') {
    doLast {
        def configFile = file('src/main/assets/capacitor.config.json')
        if (!configFile.isFile() || !file('src/main/assets/public/index.html').isFile() || !file('src/main/assets/public/privacy.html').isFile()) {
            throw new GradleException('Missing bundled client. Run pnpm android:aab from the repository root.')
        }
        def config = new groovy.json.JsonSlurper().parse(configFile)
        if (config.server?.url || config.server?.cleartext || config.android?.webContentsDebuggingEnabled || config.android?.allowMixedContent) {
            throw new GradleException('Release assets contain development server or unsafe WebView settings. Unset CAP_SERVER_URL and sync Android again.')
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn 'validatePlayRelease', 'verifyReleaseAssets'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Sharing shortcuts, the chats the share sheet offers by name (ShareInPlugin).
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // How the radio core's Kotlin bindings reach the Rust library.
    implementation "net.java.dev.jna:jna:$jnaVersion@aar"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
