[package]
name = "meshcore-core"
version = "0.1.0"
edition = "2021"
description = "The radio's side of Meshnet for every shell: one radio shared by several clients, and notices while the page sleeps"
publish = false

[lib]
name = "meshcore_core"
# The phones link it inside crates/phone, with voice input and the bindings for both.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32"

