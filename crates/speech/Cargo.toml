[package]
name = "speech"
version = "0.1.0"
edition = "2021"
description = "Voice input for Ommesh: speech written down on the device itself, phrase by phrase, with whisper.cpp and Silero's voice detector"
publish = false

[lib]
name = "speech"
# A library for the desktop shell and the tests, a shared one for Android, a static one for iOS.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# A downloaded model is checked against its published digest before whisper.cpp reads it.
sha2 = "0.10"

# whisper.cpp on the processor alone, no GPU backend. It is C++ built with
# CMake, and bindgen reads its header through libclang, so a build needs both;
# the build workflow says which processors to build for and which C++ runtime
# to link. `log_backend` hands whisper's chatter to `log`. 32-bit builds go
# without: see `engine`.
[target.'cfg(target_pointer_width = "64")'.dependencies]
whisper-rs = { version = "0.16", features = ["log_backend"] }

[profile.release]
# The phone carries it: small over fast for the Rust around whisper.cpp,
# whose C++ CMake builds optimised for speed either way. Not stripped: the
# bindings are read from its symbols, and Android strips it when it packs it.
opt-level = "s"
lto = true
codegen-units = 1

# The tests cut seconds of audio into frames and phrases; unoptimised
# whisper.cpp would take minutes over a recording.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
