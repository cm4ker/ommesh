[package]
name = "link-fetch"
version = "0.1.0"
edition = "2021"
description = "What a link in a message leads to, fetched for its preview without reaching into the reader's own network"
publish = false

[lib]
name = "link_fetch"

[dependencies]
# Rustls with ring and Mozilla's roots: the same on the desktop and on both
# phones, with no system TLS library and no C toolchain beyond ring's own.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
# The host of a link as the URL standard reads it: `http://127.1` and `http://0x7f000001` are both 127.0.0.1.
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util"] }
